# Every host reads the same file. Each Mac uses the [machines] entry matching its cores and memory,
# and refuses to start without one, so a new kind of Mac needs an entry here first.

[github]
organization = "my-org"
app_id = 123456
private_key = "~/github.pem"   # relative to the runner user's home
runner_group = "Default"
labels = ["macos-arm64"]       # self-hosted, macOS and ARM64 are always added

[vm]
image = "ghcr.io/cirruslabs/macos-tahoe-xcode:latest"
insecure = false               # true for a plain-HTTP registry
username = "admin"
password = "admin"

[runner]
version = "latest"             # or pin, e.g. "2.337.0"

[host]
max_vm_hours = 24

[machines.m4-pro-48gb]
cores = 12
memory_gb = 48
slots = 2                      # at most 2, Apple's licence limit; 0 drains every Mac of this kind
vm = { cpu = 6, memory_gb = 22 }
labels = ["large"]             # added to github.labels

[machines.m2-24gb]
cores = 8
memory_gb = 24
slots = 2
vm = { cpu = 4, memory_gb = 10 }

[machines.m1-16gb]
cores = 8
memory_gb = 16
slots = 2
vm = { cpu = 4, memory_gb = 7 }
